<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b8a44">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Fohlen & Flieger</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="topbar">
    <button id="btn-home" class="icon-btn" title="Menü">🏠</button>
    <div class="brand">Fohlen <span>&amp;</span> Flieger</div>
    <div class="hud">
      <span class="pill" id="hud-level">⭐ 1</span>
      <span class="pill" id="hud-daily">🎯 0/20</span>
      <span class="pill coin" id="hud-coins">🪙 0</span>
      <span class="pill gold" id="hud-balls">⚽ 0</span>
      <button id="btn-sound" class="icon-btn" title="Ton an/aus">🔊</button>
    </div>
  </header>

  <main>
    <section id="screen-welcome" class="screen">
      <div class="welcome">
        <div class="logo">⚽✈️</div>
        <h1>Willkommen bei Fohlen &amp; Flieger!</h1>
        <p>Schieß Elfmeter, flieg die Beluga – und werde dabei nebenbei zum Mathe-, Englisch- und Deutsch-Profi.</p>
        <input id="welcome-name" placeholder="Wie heißt du?" maxlength="20" autocomplete="off" value="Raphael">
        <button id="welcome-go" class="primary">Los geht's ▶</button>
      </div>
    </section>

    <section id="screen-home" class="screen"></section>

    <section id="screen-penalty" class="screen game">
      <div class="scoreboard"></div>
      <div class="question-box">
        <div class="q-mode"></div>
        <div class="q-meta"></div>
        <div class="q-text"></div>
        <div class="timer"><i></i><span class="timer-text"></span></div>
      </div>
      <div class="canvas-wrap">
        <canvas id="penalty-canvas"></canvas>
        <div class="feedback hidden">
          <div class="fb-text"></div>
          <button id="pen-next" class="primary">Weiter ▶</button>
        </div>
      </div>
    </section>

    <section id="screen-flight" class="screen game">
      <div class="question-box">
        <div class="q-row"><div class="q-meta"></div><div class="q-status"></div><button class="btn-pause">⏸ Pause</button></div>
        <div class="q-text"></div>
        <div class="flight-feedback"></div>
      </div>
      <div class="canvas-wrap"><canvas id="flight-canvas"></canvas></div>
    </section>

    <section id="screen-sprint" class="screen game">
      <div class="sprint">
        <div class="sprint-left">
          <div class="sprint-board">
            <div class="clock">0'</div>
            <div class="goals">⚽ 0</div>
            <div class="best">Rekord: 0</div>
          </div>
          <div class="timer"><i></i></div>
          <div class="sprint-meta"></div>
          <div class="sprint-q"></div>
          <div class="sprint-fb"></div>
        </div>
        <div class="keypad">
          <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
          <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
          <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
          <button data-k="del" class="del">⌫</button><button data-k="0">0</button><button data-k="ok" class="ok">✔</button>
        </div>
      </div>
    </section>

    <section id="screen-cockpit" class="screen game qgame">
      <div class="question-box">
        <div class="q-row"><div class="q-meta"></div><div class="q-status"></div><button class="btn-pause">⏸ Pause</button></div>
        <div class="q-text"></div>
        <div class="timer"><i></i><span class="timer-text"></span></div>
        <div class="flight-feedback"></div>
      </div>
      <div class="canvas-wrap"><canvas></canvas></div>
    </section>

    <section id="screen-cargo" class="screen game qgame">
      <div class="question-box">
        <div class="q-row"><div class="q-meta"></div><div class="q-status"></div><button class="btn-pause">⏸ Pause</button></div>
        <div class="q-text"></div>
        <div class="timer"><i></i><span class="timer-text"></span></div>
        <div class="flight-feedback"></div>
      </div>
      <div class="canvas-wrap"><canvas></canvas></div>
    </section>

    <section id="screen-pass" class="screen game qgame">
      <div class="question-box">
        <div class="q-row"><div class="q-meta"></div><div class="q-status"></div><button class="btn-pause">⏸ Pause</button></div>
        <div class="q-text"></div>
        <div class="timer"><i></i><span class="timer-text"></span></div>
        <div class="flight-feedback"></div>
      </div>
      <div class="canvas-wrap"><canvas></canvas></div>
    </section>

    <section id="screen-hangar" class="screen page"></section>
    <section id="screen-album" class="screen page"></section>
    <section id="screen-parents" class="screen page"></section>
    <section id="screen-result" class="screen"></section>
  </main>
  <div id="toasts"></div>

  <script src="js/questions.js"></script>
  <script src="js/content.js"></script>
  <script src="js/fussball.js"></script>
  <script src="js/data.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/draw.js"></script>
  <script src="js/penalty.js"></script>
  <script src="js/flight.js"></script>
  <script src="js/sprint.js"></script>
  <script src="js/quizgame.js"></script>
  <script src="js/cockpit.js"></script>
  <script src="js/cargo.js"></script>
  <script src="js/pass.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
